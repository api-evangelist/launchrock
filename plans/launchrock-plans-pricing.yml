description: >-
  Launchrock is not sold as a standalone product. Its published pricing page sells
  the Startups.com "Startups Unlimited" subscription, which bundles Launchrock with
  Bizplan, Fundable, the Startup University course library and the founder community.
  Every tier below carries the same feature set ("unlimited launch sites and premium
  features") and differs only in billing term. There is no free tier, no usage
  metering, no per-seat pricing and no API-related quota or overage, because there is
  no public API to meter. Billing is processed through Chargebee (chargebee.js is
  loaded on the pricing page).
