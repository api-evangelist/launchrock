contract_discovery:
  summary: >-
    STEP 0b contract discovery was re-run in full against every Launchrock host. One
    live machine surface exists and it is not a published contract: an internal Apollo
    GraphQL endpoint that backs the Startups.com web application.
  openapi:
    found: false
    probed:
    - url: https://www.launchrock.com/openapi.json
      status: 404
      body: SPA HTML shell
    - url: https://www.launchrock.com/swagger.json
      status: 404
      body: SPA HTML shell
    - url: https://www.launchrock.com/api-docs
      status: 404
      body: SPA HTML shell
    - url: https://api.launchrock.com/openapi.json
      status: 429
      body: >-
        Redirects to www.startups.com, which answered 429 to every request during the
        probe window. api.launchrock.com is a CNAME onto site.startups.com — wildcard
        DNS, no API host behind it.
    - url: https://api.launchrock.com/v1/openapi.json
      status: 429
    - url: https://api.launchrock.com/swagger.json
      status: 429
    - url: https://api.launchrock.com/docs
      status: 429
  graphql:
    found: true
    published: false
    endpoint: https://www.launchrock.com/graphql
    server: Apollo Server
    introspection: disabled
    sdl_captured: false
    evidence:
    - url: https://www.launchrock.com/graphql
      method: GET
      status: 401
      body: '{"error":"Not Allowed"}'
    - url: https://www.launchrock.com/graphql
      method: POST
      status: 400
      body: >-
        {"errors":[{"message":"GraphQL introspection is not allowed by Apollo Server...
        "extensions":{"validationErrorCode":"INTROSPECTION_DISABLED"}}]}
    - url: https://www.launchrock.com/graphql
      method: POST
      status: 200
      body: '{"data":{"__typename":"Query"}}'
      note: >-
        A valid non-introspection query succeeds unauthenticated when an Origin header
        is sent, confirming the server is live rather than a stub.
    ownership: >-
      The endpoint is served from Launchrock's own domain but belongs to the shared
      Startups.com platform, not to a Launchrock developer program. Response headers
      carry x-sco-host: startups3-production-1/-2 (sco = Startups.CO), and
      access-control-allow-origin reflects whichever Startups.com brand origin is sent
      (www.startups.com and www.launchrock.com both accepted). The launchrock.com front
      end is the Startups.com React application — its script bundles are served from a
      shared CloudFront distribution and include chunks named
      "Account-Products-Launchrock" and "Account-Products-Bizplan" side by side.
    verdict: >-
      NOT recorded as a published contract and NOT wired to a GraphQL pointer. No SDL
      is obtainable (introspection is disabled in production), no schema, no reference,
      no authentication documentation and no developer terms exist for it. It is the
      web app's private backend, and treating it as an API surface would credit
      Launchrock with a developer program it does not run.
  mcp:
    found: false
    note: No hosted MCP server is advertised on any Launchrock or Startups.com surface.
  agent_card:
    found: false
    note: >-
      Both /.well-known/agent-card.json and the legacy /.well-known/agent.json return
      404 with an HTML body on www.launchrock.com. Per the pipeline's search-only rule,
      no a2a/ artifact was written.
  asyncapi:
    found: false
    note: >-
      No webhook, event or streaming surface is documented. The Launchrock help center
      (help.startups.com/knowledge/launchrock) contains zero occurrences of the word
      "API" — its Launchrock section is entirely DNS A-record and CNAME instructions
      for pointing a custom domain at a launch page.
