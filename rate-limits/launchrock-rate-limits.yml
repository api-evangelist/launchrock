name: Launchrock rate limits
description: >-
  Launchrock publishes no rate limits, because it publishes no public API. limit_count
  is an honest zero. The one rate-limit signal observed anywhere on a Launchrock host
  comes from the shared Startups.com application backend at
  https://www.launchrock.com/graphql — an internal, undocumented Apollo Server that
  emits x-rl-* counters on rejected requests. That endpoint is not a developer surface
  (introspection is disabled, GET returns 401, there is no documentation of any kind),
  so its counters are recorded below as an observation only and are deliberately NOT
  presented as a published rate-limit policy.
