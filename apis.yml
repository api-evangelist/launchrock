aid: launchrock
name: LaunchRock
description: >-
  Launchrock is a hosted launch-page and customer-acquisition tool for early-stage
  founders. It provides a drag-and-drop WYSIWYG builder for pre-launch marketing
  pages, email capture forms, viral referral and social-sharing mechanics, and
  simple survey questions, so a founder can stand up a "coming soon" site and
  collect a waitlist of early users before a product ships. The platform pairs the
  builder with an education layer of founder courses, masterclass videos and
  how-to guides on customer acquisition, plus a community of mentors and founders.
  Launchrock is operated as one product line of the Startups.com platform,
  alongside Fundable, Bizplan and Clarity.fm, and is bundled into the Startups
  Unlimited subscription; its help content is served from the Startups.com
  knowledge base. Vevo, HotelTonight and theCHIVE are cited as sites that launched
  on the platform. Launchrock was originally a 500 Global (500 Startups) portfolio
  company. As of this profile Launchrock publishes no public API, developer portal,
  API reference, OpenAPI description, SDKs, CLI, webhook catalog or sandbox;
  delivery is entirely through the hosted web application.
