  Re-enriched 2026-08-13 with full STEP 0b contract discovery. /api, /docs,
  /developers, /developer, /blog, /changelog and /status on launchrock.com all 404;
  /openapi.json, /swagger.json and /api-docs return the SPA HTML shell; the api.,
  app., developers., developer., docs., status., trust. and blog. subdomains either
  404, resolve onto the generic Startups.com site cluster, or are dead legacy hosts.
  No /.well-known/ documents, no agent card at either the canonical or legacy path,
  no /llms.txt, no public OpenAPI, SDK, CLI or Postman collection, and no GitHub
  organization. One live machine surface exists and is not a developer API: an
  internal Apollo GraphQL endpoint at /graphql serving the shared Startups.com
  application, with introspection disabled in production. No-code landing-page
  builder delivered as a Startups.com product line. Identity, contract-discovery
  probe, domain-security, plans, packages, rate-limits and llms.txt artifacts only.
